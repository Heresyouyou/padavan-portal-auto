# ============================================================
# dnsmasq 持久化优化片段
# 放置路径: /etc/storage/dnsmasq/dnsmasq.conf
#   （Padavan 的主配置 /etc/dnsmasq.conf 由 rc 生成、重启会重写，
#     但它末尾有 conf-file=/etc/storage/dnsmasq/dnsmasq.conf，
#     所以写这里才能持久化）
#
# ⚠️⚠️ 绝对不要在本文件里写 cache-size !!!
#   主配置已有 cache-size=1024，重复定义会导致:
#     dnsmasq: illegal repeated keyword at line N
#   → dnsmasq 拒绝启动 → DNS 全断 → 全家无法上网
#   要改缓存大小请用: nvram set dnsmasq_cache_size=<N>
#
# ⚠️ 部署流程（顺序不能错）:
#   1) 写入本文件
#   2) /usr/sbin/dnsmasq --test -C /etc/dnsmasq.conf   # 必须输出 syntax check OK
#   3) 只有校验通过才: /sbin/rc restart_dns
#   4) /sbin/mtd_storage.sh save
# ============================================================

# 延长 DNS 条目驻留时间，大幅减少对上游 DNS 的查询次数
# 实测: TTL 由 53/298 → ~1789
min-cache-ttl=1800

max-cache-ttl=86400

# 过滤 AAAA 查询（仅在确认链路无 IPv6 时使用）
# 检查方法: ip -6 addr show 无 inet6、无 IPv6 默认路由
# 实测: AAAA 应答只剩 CNAME，不再下发 IPv6 地址，每个域名少一次查询
filter-AAAA
