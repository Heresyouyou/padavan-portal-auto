# Custom user conf file for dnsmasq
# Please add needed params only!

### Web Proxy Automatic Discovery (WPAD)
dhcp-option=252,"\n"

### Set the limit on DHCP leases, the default is 150
#dhcp-lease-max=150

### Add local-only domains, queries are answered from hosts or DHCP only
#local=/router/localdomain/

### Examples:

### Enable built-in TFTP server
#enable-tftp

### Set the root directory for files available via TFTP.
#tftp-root=/opt/srv/tftp

### Make the TFTP server more secure
#tftp-secure

### Set the boot filename for netboot/PXE
#dhcp-boot=pxelinux.0

# 过滤 IPv6（AAAA）查询请求
#filter-AAAA


# ==== 腾讯/游戏 DNS 专项优化 (2026-09-29) ====
# 加大缓存 + 延长条目驻留, 减少对不稳定的校园上游 DNS 的查询次数
min-cache-ttl=1800
max-cache-ttl=86400
# 本机无 IPv6, 过滤 AAAA 可让每个域名少一次查询
filter-AAAA
